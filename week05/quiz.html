<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMl and CSS quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>✅ Basuc HTML and CSS quiz</h1>
        <form action="">
            <div class="quiz">
                <label for="q1">1. What does the aronym CSS shand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz">
                <label for="q2">2. How are id and class attributes selected in CSS?</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div class="quiz">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one ....</option>
                    <option value="1">&lt;!--This is a comment--&gt;</option>
                    <option value="2">//This is a comment</option>
                    <option value="3">/*This is a comment*/</option>
                </select>
            </div>
            <div class="quiz">
                <label for="q4">4. What is the bottom margin given in this declaration?</label>
                <code>margin: 10px 5px 15px;</code>
                <input type="number" name="q4" id="q4">
            </div>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
