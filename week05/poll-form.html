<body>
    <header>

    </header>
    <main>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <lebel for="quantity">What is your favorite browser?</lebel>
        <select name="quantity" id="quantity">
            <option value="1">google chrome</option>
            <option value="2">microsoft edge</option>
            <option value="3">vivaldi</option>
            <option value="4">Opera</option>
            <option value="5">Firefox</option>
            <option value="6">DuckDuckGo</option>
            <option value="7">Brave</option>
            <option value="8">Safari</option>
        </select>
        <label for="pet">Do you have a household pet?</label>
        <input type="checkbox" id="pet" name="pet">
        <label for="feedback">List the places you have lived.</label>
        <textarea id="feedback" name="feedback" rows="4"
          placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>

        <button type="submit">Submit</button>
    </main>
