<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact Us page Rapids</title>
    <meta name="description"
      content="all about white water rafting Assignment: Rafting Site contact Us Page">
    <meta name="author" content="Cameron Fay">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-rapids-trees.jpg" alt="rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div>
            <section class="clear">
                <h1 class="clear">white water rafting Company</h1>
                <p class="clear">123 Main River Street</>
                <P class="clear">Kolob, California</P>
                <p class="clear">+1 999 999 999</>
                <p class="clear">info@whitewater.com</p>
            </section>
        </div>
        <section class="contact">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m12!1m8!1m3!1d13508.90085113923!2d-111.3612969!3d40.7406676!3m2!1i1024!2i768!4f13.1!2m1!1srafting!5e1!3m2!1sen!2sus!4v1770590572755!5m2!1sen!2sus"
              width="400" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <form>
                <div>
                    <label for="name">Name: </label>
                    <input type="text" id="name" name="name" placeholder="max" required>
                </div>
                <div>
                    <label for="email">Email: </label>
                    <input type="email" id="email" name="name" placeholder="sample@gmail.com"
                      required>
                </div>

                <p class="clear">Message Purpose</p>
                <div>
                    <input type="radio" name="purpose" id="purpose-1">
                    <label for="purpose-1">General Inquiry</label>
                </div>
                <div>

                    <input type="radio" name="purpose" id="purpose-2">
                    <label for="purpose-2">Reservation Question</label>
                </div>
                <div>
                    <input type="radio" name="purpose" id="purpose-3">
                    <label for="purpose-3">Website Suggestion</label>
                </div>
                <div>
                    <label for="message">message:</label>
                </div>
                <textarea name="message" id="message" placeholder="type here" required></textarea>
                <div>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to my newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section class="employee">
            <h2>We Are here to Serve You</h2>
            <figure>
                <img src="images/employee-1.jpg" alt="adventure 1">
                <figcaption>raft guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee-2.jpg" alt="adventure 2">
                <figcaption>customer service representative</figcaption>
            </figure>
            <figure>
                <img src="images/employee-3.jpg" alt="adventure 3">
                <figcaption>BOSS</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©️2026 | Rapids | Cameron Fay</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="facebook"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="linkedin"></a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="instagram"></a>
        </nav>
    </footer>
</body>

</html>
